<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 林家花園旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#3a3f44;
    --title:#33373b;
    --muted:#9aa0a6;
    --gold:#c8a86b;
    --line:#e8e8e6;
    --line-hover:#cfcfca;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Sans TC",sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:90px 32px 64px;
  }

  /* 標題區 */
  .masthead{text-align:center;margin-bottom:70px}
  .masthead h1{
    font-weight:300;
    font-size:clamp(1.85rem,5.2vw,3.1rem);
    letter-spacing:.14em;
    text-indent:.14em;
    color:var(--title);
    text-wrap:balance;
  }
  .masthead .sub{
    margin-top:24px;
    font-size:clamp(.92rem,2.2vw,1.08rem);
    font-weight:400;
    letter-spacing:.34em;
    text-indent:.34em;
    color:var(--gold);
    text-wrap:balance;
  }
  .masthead .rule{
    width:56px;height:1px;
    background:var(--gold);
    opacity:.6;
    margin:34px auto 0;
  }

  /* 卡片 */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:26px;
  }
  .card{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    text-decoration:none;
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    padding:54px 36px;
    transition:border-color .35s ease,transform .35s ease,box-shadow .35s ease;
  }
  .card:hover,.card:focus-visible{
    border-color:var(--line-hover);
    transform:translateY(-4px);
    box-shadow:0 16px 36px -22px rgba(40,44,48,.4);
    outline:none;
  }
  .card:active{
    border-color:var(--gold);
    background:#fcfaf5;
    transform:translateY(0);
  }
  .card h2{
    font-weight:500;
    font-size:clamp(1.2rem,2.8vw,1.55rem);
    letter-spacing:.16em;
    text-indent:.16em;
    color:var(--title);
    text-wrap:balance;
  }
  .card p{
    margin-top:18px;
    font-weight:300;
    font-size:.97rem;
    letter-spacing:.08em;
    color:var(--muted);
    text-wrap:balance;
  }

  /* 頁尾 */
  footer{
    text-align:center;
    margin-top:80px;
    font-weight:300;
    font-size:.9rem;
    letter-spacing:.18em;
    text-indent:.18em;
    color:var(--muted);
  }

  /* ── 平板 ── */
  @media(max-width:768px){
    .wrap{padding:72px 26px 52px}
    .masthead{margin-bottom:54px}
    .card{padding:46px 30px}
  }

  /* ── 手機 ── */
  @media(max-width:520px){
    .wrap{padding:56px 20px 44px}
    .masthead{margin-bottom:40px}
    .masthead h1{letter-spacing:.06em;text-indent:.06em}
    .masthead .sub{margin-top:18px;letter-spacing:.22em;text-indent:.22em}
    .masthead .rule{margin-top:26px}
    .grid{grid-template-columns:1fr;gap:16px}
    .card{padding:34px 24px;border-radius:10px}
    .card h2{letter-spacing:.08em;text-indent:.08em}
    .card p{margin-top:12px;font-size:.94rem}
    footer{margin-top:52px;letter-spacing:.12em;text-indent:.12em}
  }

  /* ── 小型手機 ── */
  @media(max-width:360px){
    .wrap{padding:48px 16px 40px}
    .card{padding:30px 20px}
    .card h2{letter-spacing:.04em;text-indent:.04em}
  }

  @media(prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>2026 林家花園旅行</h1>
    <div class="sub">福井 名古屋 岐阜</div>
    <div class="rule"></div>
  </header>

  <div class="grid">

    <a class="card" href="JPjourney2026.html">
      <h2>行程規劃</h2>
      <p>8 天　10 大 5 小</p>
    </a>

    <a class="card" href="japan.html">
      <h2>日本中部地理人文大冒險</h2>
    </a>

    <a class="card" href="japan-map-puzzle.html">
      <h2>全日本地理拼圖</h2>
    </a>

    <a class="card" href="japan-chubu-map-puzzle.html">
      <h2>日本中部地區地理拼圖</h2>
    </a>

  </div>

  <footer>© 林家花園 制作</footer>

</div>
</body>
</html>
