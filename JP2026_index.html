<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 林家花園旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffdfb;
    --ink:#5a5550;
    --title:#4a4540;
    --muted:#9aa0a6;
    --gold:#d8ae6a;
    --line:#ecebe8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Sans TC",sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:90px 32px 64px;
  }

  /* 標題區 */
  .masthead{text-align:center;margin-bottom:60px}
  .masthead h1{
    font-weight:300;
    font-size:clamp(1.85rem,5.2vw,3.1rem);
    letter-spacing:.14em;
    text-indent:.14em;
    color:var(--title);
    text-wrap:balance;
  }
  .masthead .sub{
    margin-top:24px;
    font-size:clamp(.92rem,2.2vw,1.08rem);
    font-weight:400;
    letter-spacing:.34em;
    text-indent:.34em;
    color:var(--gold);
    text-wrap:balance;
  }
  .masthead .rule{
    width:56px;height:1px;
    background:var(--gold);
    opacity:.55;
    margin:30px auto 0;
  }

  /* 卡片 */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:24px;
  }
  .card{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    text-decoration:none;
    background:var(--cbg);
    border:1px solid var(--cbd);
    border-radius:16px;
    padding:26px 30px;
    min-height:162px;            /* 統一區塊大小 */
    transition:border-color .35s ease,transform .35s ease,box-shadow .35s ease,background .35s ease;
  }
  /* 奇數張時，最後一張置中 */
  .grid > .card:last-child:nth-child(odd){
    grid-column:1 / -1;
    justify-self:center;
    width:calc(50% - 12px);
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-4px);
    box-shadow:0 16px 34px -20px var(--csh);
    outline:none;
  }
  .card:active{
    filter:brightness(.97);
    transform:translateY(0);
  }
  .card h2{
    font-weight:500;
    font-size:clamp(1.2rem,2.8vw,1.55rem);
    letter-spacing:.16em;
    text-indent:.16em;
    color:var(--ctt);
    text-wrap:balance;
  }
  .card p{
    margin-top:14px;
    font-weight:400;
    font-size:.97rem;
    letter-spacing:.08em;
    color:var(--csb);
    text-wrap:balance;
  }
  .card p.en{letter-spacing:.18em;text-indent:.18em;font-style:italic}

  /* 淡淡童趣配色 */
  .c1{--cbg:#fdf2ea;--cbd:#f3dcca;--ctt:#c47c47;--csb:#cb9b78;--csh:rgba(196,124,71,.4)}
  .c2{--cbg:#ebf6ef;--cbd:#cfe7d8;--ctt:#56a079;--csb:#86b89e;--csh:rgba(86,160,121,.4)}
  /* 南法鄉間小屋・暖赭土色（三張同色）*/
  .warm{--cbg:#f6e7cd;--cbd:#e7d1a3;--ctt:#b07c3c;--csb:#bf9f63;--csh:rgba(176,124,60,.42)}

  /* 頁尾 */
  footer{
    text-align:center;
    margin-top:60px;
    font-weight:300;
    font-size:.9rem;
    letter-spacing:.18em;
    text-indent:.18em;
    color:var(--muted);
  }

  /* ── 平板 ── */
  @media(max-width:768px){
    .wrap{padding:64px 26px 48px}
    .masthead{margin-bottom:46px}
    .card{min-height:150px;padding:24px 26px}
    footer{margin-top:48px}
  }

  /* ── 手機：整頁滿版，五張卡平均分高 ── */
  @media(max-width:520px){
    html,body{height:100vh;height:100dvh;overflow:hidden}
    body{display:flex;flex-direction:column}
    .wrap{
      flex:1;min-height:0;
      display:flex;flex-direction:column;
      max-width:none;
      padding:26px 16px 16px;
    }
    .masthead{flex:0 0 auto;margin-bottom:16px}
    .masthead h1{font-size:1.7rem;letter-spacing:.06em;text-indent:.06em}
    .masthead .sub{margin-top:14px;letter-spacing:.22em;text-indent:.22em}
    .masthead .rule{margin-top:18px}
    .grid{
      flex:1;min-height:0;
      grid-template-columns:1fr;
      grid-template-rows:repeat(5,1fr);
      gap:10px;
    }
    .grid > .card:last-child:nth-child(odd){grid-column:auto;width:auto;justify-self:stretch}
    .card{min-height:0;padding:8px 18px;border-radius:14px}
    .card h2{letter-spacing:.08em;text-indent:.08em}
    .card p{margin-top:6px;font-size:.9rem}
    footer{flex:0 0 auto;margin-top:14px;font-size:.82rem}
  }

  /* ── 小型手機 ── */
  @media(max-width:360px){
    .wrap{padding:20px 13px 13px}
    .masthead h1{font-size:1.5rem}
    .card{padding:6px 14px}
    .card h2{letter-spacing:.04em;text-indent:.04em;font-size:1.12rem}
  }

  /* 櫻花花瓣（慢速飄落）*/
  .sakura{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:50}
  .petal{
    position:absolute;top:-12vh;
    background:radial-gradient(120% 120% at 30% 25%,#ffe3ec 0%,#f9c2d6 55%,#f3a9c4 100%);
    border-radius:100% 0 100% 0;
    opacity:0;
    will-change:transform,margin-left,opacity;
    animation-name:petalFall,petalSway;
    animation-timing-function:linear,ease-in-out;
    animation-iteration-count:infinite,infinite;
  }
  @keyframes petalFall{
    0%{transform:translateY(0) rotate(0);opacity:0}
    10%{opacity:var(--op,.8)}
    90%{opacity:var(--op,.8)}
    100%{transform:translateY(124vh) rotate(var(--spin,540deg));opacity:0}
  }
  @keyframes petalSway{
    0%,100%{margin-left:0}
    50%{margin-left:var(--sway,40px)}
  }

  @media(prefers-reduced-motion:reduce){
    *{transition:none!important}
    .sakura{display:none}
  }
</style>
</head>
<body>
<div class="sakura" aria-hidden="true"></div>
<div class="wrap">

  <header class="masthead">
    <h1>2026 林家花園旅行</h1>
    <div class="sub">福井 名古屋 岐阜</div>
    <div class="rule"></div>
  </header>

  <div class="grid">

    <a class="card c1" href="JPjourney2026.html">
      <h2>行程規劃</h2>
      <p>8 天　10 大 5 小</p>
    </a>

    <a class="card c2" href="jpgodutch.html">
      <h2>旅行分帳</h2>
      <p class="en">Go Dutch</p>
    </a>

    <a class="card warm" href="japan-map-puzzle.html">
      <h2>日本地理拼圖</h2>
    </a>

    <a class="card warm" href="japan.html">
      <h2>地理人文大冒險</h2>
    </a>

    <a class="card warm" href="japan-map-chubu.html">
      <h2>中部城市拼圖</h2>
      <p>北陸、東海、甲信越</p>
    </a>

  </div>

  <footer>© 林家花園 制作</footer>

</div>

<script>
(function(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var layer=document.querySelector('.sakura');
  if(!layer)return;
  var tints=[
    'radial-gradient(120% 120% at 30% 25%,#ffe3ec 0%,#f9c2d6 55%,#f3a9c4 100%)',
    'radial-gradient(120% 120% at 30% 25%,#fff0f4 0%,#fcd0de 55%,#f7b9cd 100%)',
    'radial-gradient(120% 120% at 30% 25%,#ffe7d8 0%,#fbccc0 55%,#f6b3ac 100%)'
  ];
  var N=22;
  for(var i=0;i<N;i++){
    var p=document.createElement('span');
    p.className='petal';
    var size=8+Math.random()*10;
    var fall=(16+Math.random()*12)/0.7;  // 再慢 30%（約 23–40s）
    var sway=4+Math.random()*4;        // 左右微擺
    var dir=Math.random()<0.5?1:-1;
    p.style.left=(Math.random()*100)+'vw';
    p.style.width=size+'px';
    p.style.height=(size*0.86)+'px';
    p.style.background=tints[i%tints.length];
    p.style.setProperty('--op',(0.5+Math.random()*0.4).toFixed(2));
    p.style.setProperty('--spin',(dir*(360+Math.random()*360)).toFixed(0)+'deg');
    p.style.setProperty('--sway',(dir*(30+Math.random()*55)).toFixed(0)+'px');
    p.style.animationDuration=fall.toFixed(1)+'s,'+sway.toFixed(1)+'s';
    p.style.animationDelay=(-Math.random()*fall).toFixed(1)+'s,'+(-Math.random()*sway).toFixed(1)+'s';
    layer.appendChild(p);
  }
})();
</script>

</body>
</html>
