<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>長頸鹿 Action Book 3 — Words &amp; Sentence Patterns</title>
<style>

  body {

    background: #f1f5f9; color: #1e293b;
    margin: 0; padding: 0; line-height: 1.6;

  /* ===== 頂部固定列（含週次 + 語速） ===== */

  .top-title {
    text-align: center; color: #1d4ed8;
    font-size: 0.98rem; font-weight: 800; margin: 0 0 5px;
    line-height: 1.3;
  }
  /* 週次與語速並列為一行 */
  .top-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px 12px;
    flex-wrap: wrap;
  }
  .week-tabs {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .week-tab {
    background: #f1f5f9; color: #475569;
    border: 2px solid #e2e8f0; border-radius: 999px;
    padding: 3px 11px; font-size: 0.78rem; font-weight: 800;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
    line-height: 1.4;
  }
  .week-tab:hover { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; }
  .week-tab.active {

  }

  .speed-bar {
    display: flex; align-items: center;
    gap: 4px; flex-wrap: wrap;
    padding-left: 8px;
    border-left: 1.5px solid #e2e8f0;
  }
  .speed-label {
    font-size: 0.72rem; font-weight: 800; color: #475569;
    white-space: nowrap;
  }
  .speed-btn {
    font-size: 0.72rem; font-weight: 800;
    border: 1.5px solid #e2e8f0; border-radius: 999px;
    padding: 3px 10px; background: #f8fafc; color: #64748b;

    line-height: 1.4;
  }
  .speed-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

  /* ===== 容器 ===== */
  .container {
    max-width: 1000px; margin: 0 auto;
    padding: 22px 28px;
  }

  /* ===== 週次面板 ===== */
  .week-panel { display: none; }
  .week-panel.active { display: block; }

  .week-intro {
    background: linear-gradient(135deg, #eff6ff, #dbeafe);
    border-left: 5px solid #2563eb;
    border-radius: 10px;
    padding: 14px 18px; margin-bottom: 18px;

  }

  /* ===== Lesson 卡片 ===== */

    border-radius: 12px;
    padding: 16px 20px;

    font-weight: 800; font-size: 0.92rem;
    flex-shrink: 0;

  .lesson-num.review {

  }
  .lesson-topic { color: #475569; font-size: 0.9rem; font-weight: 600; }

  /* ===== 子段標籤 ===== */
  .subsection-label {
    display: inline-block;
    font-size: 0.88rem; font-weight: 800;
    color: #1e40af; padding: 4px 12px;

  .pattern-en .pos-verb     { color: #b45309; }   /* 一般動詞 — 棕橘 */

  .pattern-en .pos-aux      { color: #dc2626; }   /* 助動詞（do/does） — 紅 */
  .pattern-en .pos-adj      { color: #7c3aed; }   /* 形容詞 — 紫 */
  .pattern-en .pos-pron     { color: #0f766e; }   /* 代名詞 — 青 */
  .pattern-en .pos-art      { color: #94a3b8; }   /* 冠詞 — 灰 */
  .pattern-en .pos-prep     { color: #ca8a04; }   /* 介係詞 — 金黃 */
  .pattern-en .pos-wh       { color: #be185d; }   /* 疑問詞 — 桃紅 */
  .pattern-en .pos-num      { color: #ea580c; }   /* 數詞 — 橘 */
  .pattern-en .pos-conj     { color: #475569; }   /* 連接詞 — 深灰 */

<!-- ====== 頂部固定列：標題 + 週次切換 + 語速列 ====== -->
<div class="top-bar">
  <div class="top-title">📘 長頸鹿 Action Book 3 — Words &amp; Sentence Patterns</div>
  <div class="top-controls">
    <div class="week-tabs">
      <button class="week-tab active" data-week="1" onclick="switchWeek(1)">
        第一週<span class="week-meta">L1–L5</span>
      </button>
      <button class="week-tab" data-week="2" onclick="switchWeek(2)">
        第二週<span class="week-meta">L6–L10</span>
      </button>
      <button class="week-tab" data-week="3" onclick="switchWeek(3)">
        第三週<span class="week-meta">L11–L15</span>
      </button>
      <button class="week-tab" data-week="4" onclick="switchWeek(4)">
        第四週<span class="week-meta">L16–L19</span>
      </button>
    </div>
    <div class="speed-bar">
      <span class="speed-label">🔊</span>
      <button class="speed-btn" onclick="setSpeed(0.5)" data-rate="0.5">慢</button>
      <button class="speed-btn active" onclick="setSpeed(0.75)" data-rate="0.75">慢一點</button>
      <button class="speed-btn" onclick="setSpeed(1.0)" data-rate="1.0">正常</button>
    </div>
  </div>
</div>

<!-- ====== 容器 ====== -->
<div class="container">
  <div class="week-panel active" id="week-1"></div>
  <div class="week-panel" id="week-2"></div>
  <div class="week-panel" id="week-3"></div>
  <div class="week-panel" id="week-4"></div>
</div>

<script>
/* ============================================================
   1. TTS 引擎（預設 0.75 = 慢一點）
   ============================================================ */
let _voices = [];
let currentRate = 0.75;
function loadVoices() { _voices = window.speechSynthesis.getVoices(); }
loadVoices();
window.speechSynthesis.onvoiceschanged = loadVoices;
function getBestVoice() {
  const preferred = [
    v => v.name === 'Google US English',
    v => v.name.includes('Samantha'),
    v => v.lang === 'en-US' && v.localService,
    v => v.lang === 'en-US',
    v => v.lang.startsWith('en'),
  ];
  for (const fn of preferred) {
    const found = _voices.find(fn);
    if (found) return found;
  }
  return null;
}
function speak(text) {
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US'; utter.rate = currentRate;
  utter.pitch = 1.0; utter.volume = 1.0;
  const v = getBestVoice();
  if (v) utter.voice = v;
  setTimeout(() => window.speechSynthesis.speak(utter), 50);
}
function setSpeed(rate) {
  currentRate = rate;
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.classList.toggle('active', Math.abs(parseFloat(btn.dataset.rate) - rate) < 0.001);
  });
}
function playWord(btn, word) {
  speak(word);
  btn.classList.add('playing');
  setTimeout(() => btn.classList.remove('playing'), 1200);
}
function playSent(btn, sentence) {
  speak(sentence);
  btn.classList.add('playing');
  const dur = Math.max(1500, sentence.split(' ').length * 450);
  setTimeout(() => btn.classList.remove('playing'), dur);
}

/* ============================================================
   2. 母音自動標紅
   ============================================================ */
// 英文母音字母標紅
function highlightEnVowels(word) {
  return word.replace(/([aeiouAEIOU])/g, '<span class="vowel">$1</span>');
}
// IPA 音標母音標紅（含雙母音）
const IPA_VOWELS = ['eɪ','aɪ','oʊ','aʊ','ɔɪ','iː','uː','ɑː','ɔː','ɜː','eə','ɪə','ʊə',
                    'i','ɪ','e','ɛ','æ','ʌ','ə','ɒ','ɔ','ʊ','u','a','o'];
function highlightIpaVowels(ipa) {
  if (!ipa) return '';
  const open = ipa.startsWith('/') ? '/' : '';
  const close = ipa.endsWith('/') ? '/' : '';
  // 先移除長音符號 ː（看起來像上下箭頭，學生易混淆）
  let body = ipa.replace(/^\/|\/$/g, '').replace(/ː/g, '');
  let result = '';
  let i = 0;
  while (i < body.length) {
    let matched = false;
    for (const v of IPA_VOWELS) {
      if (body.substr(i, v.length) === v) {
        result += `<span class="vowel">${body.substr(i, v.length)}</span>`;
        i += v.length;
        matched = true;
        break;
      }
    }
    if (!matched) { result += body[i]; i++; }
  }
  return open + result + close;
}

/* ============================================================
   3. 教材資料
   patterns 可選擇用標記語法標示詞性：
     {NP:tiger} = 名詞、{V:is} = be 動詞、{ADJ:cold} = 形容詞
     {ART:a} = 冠詞、{PRO:I} = 代名詞、{WH:What} = 疑問詞
     {NUM:four} = 數詞、{PREP:on} = 介係詞、{V_:like} = 一般動詞
     {AUX:do} = 助動詞、{ADV:there} = 副詞、{CONJ:and} = 連接詞
   ============================================================ */

const lessons = {
  // ========= 第一週 =========
  L1: {
    num: 1, topic: '動物 — 老鷹、魚、鵝、老虎、狼',
    words: [
      ['eagle', '🦅', '老鷹', '/ˈiːɡəl/'],
      ['fish', '🐟', '魚', '/fɪʃ/'],
      ['goose', '🪿', '鵝', '/ɡuːs/'],
      ['tiger', '🐯', '老虎', '/ˈtaɪɡər/'],
      ['wolf', '🐺', '狼', '/wʊlf/']
    ],
    patterns: [

  },
  L19: {

    words: [
      ['silver', '🥈', '銀色', '/ˈsɪlvər/'],
      ['golden', '✨', '金色的', '/ˈɡoʊldən/'],
      ['gold', '🥇', '黃金', '/ɡoʊld/']
    ],
    patterns: [
      { type:'single',
        en:'{PRO:I} {V_:like} {ART:the} {ADJ:silver} {N:car}.',

        grammar: '主詞 I 是第一人稱，動詞用原形 <strong>like</strong>。形容詞 silver 修飾名詞 car。' },
      { type:'single',
        en:'{PRO:We} {V_:like} {ART:the} {ADJ:silver} {N:car}.',
        zh:'我們喜歡這輛銀色的車。' },
      { type:'single',

        grammar: '<strong>重點：</strong>主詞是第三人稱單數（he/she/it）時，一般動詞要加 <strong>s</strong>：like → <strong>likes</strong>。這是現在簡單式最重要的動詞變化規則。' },

/* ============================================================
   4. 週次組織
   ============================================================ */
const weekStructure = {
  1: {
    title: '第一週（Lesson 1–5）',
    desc: '介紹基本動物詞彙、玩具、三餐，並學習 There is/are 與基礎疑問句。',
    lessons: ['L1','L2','L3','L4','L5']
  },
  2: {
    title: '第二週（Lesson 6–10）',
    desc: '日常作息動作、物品位置（on/under），以及 Where is/are 句型，第 10 課為總複習。',
    lessons: ['L6','L7','L8','L9','L10']
  },
  3: {
    title: '第三週（Lesson 11–15）',
    desc: '形容詞（外觀、感覺、天氣）+ Are you...? 疑問句與 want to + 動詞句型。',
    lessons: ['L11','L12','L13','L14','L15']
  },
  4: {
    title: '第四週（Lesson 16–19）',
    desc: '活動、顏色，以及「I like / favorite color」表達喜好的句型。',
    lessons: ['L16','L17','L18','L19']
  }
};

/* ============================================================
   5. 工具函式
   ============================================================ */
function escapeAttr(s) { return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 移除句型中的詞性標記，得到純英文（用於 TTS）
function stripPosMarks(text) {
  return text.replace(/\{[A-Z_]+:([^}]+)\}/g, '$1');
}

// 把詞性標記轉成彩色 span
const POS_MAP = {
  N:    'pos-noun',     // 名詞
  V:    'pos-verb',     // 一般動詞片語（含 Let's、want to）
  V_:   'pos-verb',     // 一般動詞原形
  BE:   'pos-be',       // be 動詞 (is, are, am, isn't, aren't)
  AUX:  'pos-aux',      // 助動詞
  ADJ:  'pos-adj',      // 形容詞
  PRO:  'pos-pron',     // 代名詞 / 所有格
  ART:  'pos-art',      // 冠詞
  PREP: 'pos-prep',     // 介係詞
  WH:   'pos-wh',       // 疑問詞
  NUM:  'pos-num',      // 數詞
  CONJ: 'pos-conj',     // 連接詞
  ADV:  'pos-adv',      // 副詞
};

function colorizePos(text) {
  return text.replace(/\{([A-Z_]+):([^}]+)\}/g, (_, pos, word) => {
    const cls = POS_MAP[pos] || '';
    return `<span class="pos ${cls}">${escapeHtml(word)}</span>`;
  });
}

// 產生疑問句下方的「直述句對照」元素
function makeDeclarativeRef(decl) {
  const div = document.createElement('div');
  div.className = 'declarative-ref';
  const plain = stripPosMarks(decl.en);
  div.innerHTML = `
    <span class="ref-label">直述句</span>
    <div class="ref-text">
      <div class="ref-en">${colorizePos(decl.en)}</div>
      <div class="ref-zh">${escapeHtml(decl.zh)}</div>
    </div>
    <button class="ref-btn" onclick="playSent(this, '${escapeAttr(plain)}')">🔊</button>
  `;
  return div;
}

/* ============================================================
   6. 渲染：單一 Lesson 卡
   ============================================================ */
function renderLesson(key) {
  const L = lessons[key];
  const card = document.createElement('div');
  card.className = 'lesson';

  const head = document.createElement('div');
  head.className = 'lesson-head';
  head.innerHTML = `
    <span class="lesson-num ${L.isReview ? 'review' : ''}">Lesson ${L.num}</span>
    <span class="lesson-topic">${escapeHtml(L.topic)}</span>
  `;
  card.appendChild(head);

  if (L.isReview) {
    const box = document.createElement('div');
    box.className = 'review-box';
    box.innerHTML = `
      <span class="review-icon">🔄</span>
      ${escapeHtml(L.reviewText)}
    `;
    card.appendChild(box);
    return card;
  }

  // ----- 單字區 -----
  if (L.words && L.words.length) {
    const wordLabel = document.createElement('div');
    wordLabel.className = 'subsection-label';
    wordLabel.textContent = '📚 重點單字';
    card.appendChild(wordLabel);

    const grid = document.createElement('div');
    grid.className = 'word-grid';
    L.words.forEach(([en, emoji, zh, ipa]) => {
      const wc = document.createElement('div');
      wc.className = 'word-card';
      wc.innerHTML = `
        <div class="word-emoji">${emoji}</div>
        <div class="word-en">${highlightEnVowels(en)}</div>
        <div class="word-ipa">${highlightIpaVowels(ipa || '')}</div>
        <div class="word-zh">${escapeHtml(zh)}</div>
        <button class="play-btn" onclick="playWord(this, '${escapeAttr(en)}')">🔊 發音</button>
      `;
      grid.appendChild(wc);
    });
    card.appendChild(grid);
  }

  // ----- 核心句型 -----
  if (L.patterns && L.patterns.length) {
    const pLabel = document.createElement('div');
    pLabel.className = 'subsection-label pattern';
    pLabel.textContent = '💬 核心句型';
    card.appendChild(pLabel);

    const list = document.createElement('div');
    list.className = 'pattern-list';

    L.patterns.forEach((p, idx) => {
      if (p.type === 'single') {
        // 文法說明先顯示
        if (p.grammar) {
          const note = document.createElement('div');
          note.className = 'grammar-note';
          note.innerHTML = `
            <div class="note-title">📖 文法說明</div>
            <p>${p.grammar}</p>
          `;
          list.appendChild(note);
        }

        const row = document.createElement('div');
        row.className = 'pattern-item';
        const enPlain = stripPosMarks(p.en);
        row.innerHTML = `
          <div class="pattern-text">
            <div class="pattern-en">${colorizePos(p.en)}</div>
            <div class="pattern-zh">${escapeHtml(p.zh)}</div>
          </div>
          <button class="sent-btn" onclick="playSent(this, '${escapeAttr(enPlain)}')">🔊 唸句子</button>
        `;
        list.appendChild(row);

        // 若是疑問句且有對應直述句，縮排顯示
        if (p.decl) {
          list.appendChild(makeDeclarativeRef(p.decl));
        }
      } else if (p.type === 'dialog') {
        // 文法說明先顯示
        if (p.grammar) {
          const note = document.createElement('div');
          note.className = 'grammar-note';
          note.innerHTML = `
            <div class="note-title">📖 文法說明</div>
            <p>${p.grammar}</p>
          `;
          list.appendChild(note);
        }

        const aPlain = stripPosMarks(p.a_en);
        const bPlain = stripPosMarks(p.b_en);

        const rowA = document.createElement('div');
        rowA.className = 'pattern-item';
        rowA.innerHTML = `
          <div class="pattern-text">
            <div class="pattern-en"><span class="speaker-tag">A</span>${colorizePos(p.a_en)}</div>
            <div class="pattern-zh"><span class="speaker-tag">A</span>${escapeHtml(p.a_zh)}</div>
          </div>
          <button class="sent-btn" onclick="playSent(this, '${escapeAttr(aPlain)}')">🔊 唸句子</button>
        `;
        list.appendChild(rowA);

        // 若 A 是疑問句且有 decl，在 A 與 B 之間插入直述句對照
        if (p.decl) {
          list.appendChild(makeDeclarativeRef(p.decl));
        }

        const rowB = document.createElement('div');
        rowB.className = 'pattern-item';
        rowB.innerHTML = `
          <div class="pattern-text">
            <div class="pattern-en"><span class="speaker-tag">B</span>${colorizePos(p.b_en)}</div>
            <div class="pattern-zh"><span class="speaker-tag">B</span>${escapeHtml(p.b_zh)}</div>
          </div>
          <button class="sent-btn" onclick="playSent(this, '${escapeAttr(bPlain)}')">🔊 唸句子</button>
        `;
        list.appendChild(rowB);
      }
    });
    card.appendChild(list);
  }

  return card;
}

/* ============================================================
   7. 渲染：週次面板
   ============================================================ */
function renderWeek(weekNum) {
  const panel = document.getElementById(`week-${weekNum}`);
  panel.innerHTML = '';
  const w = weekStructure[weekNum];

  const intro = document.createElement('div');
  intro.className = 'week-intro';
  intro.innerHTML = `
    <h2>${escapeHtml(w.title)}</h2>
    <p>${escapeHtml(w.desc)}</p>
  `;
  panel.appendChild(intro);

  w.lessons.forEach(key => {
    panel.appendChild(renderLesson(key));
  });
}

/* ============================================================
   8. 切換週次
   ============================================================ */
function switchWeek(weekNum) {
  document.querySelectorAll('.week-tab').forEach(b =>
    b.classList.toggle('active', parseInt(b.dataset.week) === weekNum));
  document.querySelectorAll('.week-panel').forEach(p =>
    p.classList.toggle('active', p.id === `week-${weekNum}`));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================================
   9. 啟動
   ============================================================ */
[1, 2, 3, 4].forEach(renderWeek);
</script>
