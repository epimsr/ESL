<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本地圖拖曳拼圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b3a57; --ink2:#33536f; --line:#c2cdd6;
  --coral:#e8694a; --coral-d:#cf5435; --gold:#caa14a;
  --shadow:0 6px 18px rgba(27,58,87,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(120% 80% at 80% -10%,#eaf4fb 0%,#e3eef6 45%,#dde9f2 100%);
  min-height:100vh;padding:18px 14px 60px}
.wrap{max-width:860px;margin:0 auto}
header.top{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin:4px 4px 14px}
.title{font-weight:900;font-size:clamp(24px,5.5vw,40px);letter-spacing:.06em;line-height:1.05;
  display:flex;align-items:baseline;gap:14px}
.title .jp{font-weight:900;color:var(--coral-d);letter-spacing:.12em}
.credit{text-align:center;font-weight:600;font-size:clamp(11px,2.3vw,13px);color:#93a3b1;
  letter-spacing:.04em;margin:8px 0 4px}
.subtitle{font-size:clamp(12px,2.6vw,15px);color:var(--ink2);font-weight:500}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 4px 12px}
.tab{appearance:none;border:2px solid var(--line);background:#fff;color:var(--ink2);
  font-family:inherit;font-weight:700;font-size:clamp(13px,3vw,15px);
  padding:9px 16px;border-radius:999px;cursor:pointer;min-height:44px;
  transition:transform .12s ease,background .15s,color .15s,border-color .15s}
.tab .n{font-size:.8em;opacity:.7;margin-right:5px;font-weight:900}
.tab:hover{border-color:#9fb2c2}
.tab.active{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:var(--shadow)}
.tab:active{transform:translateY(1px)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 4px 12px}
.instruct{flex:1 1 240px;font-size:clamp(13px,2.8vw,15px);color:var(--ink2);line-height:1.5}
.instruct b{color:var(--ink)}
.counter{font-weight:900;font-size:16px;color:var(--ink);white-space:nowrap;
  background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px}
.counter .done{color:var(--coral-d)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 4px 14px}
.btn{appearance:none;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;
  border-radius:10px;padding:10px 14px;min-height:44px;border:2px solid var(--line);
  background:#fff;color:var(--ink);transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:#9fb2c2}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghosthint.on{background:var(--gold);border-color:var(--gold);color:#fff}
.stage{position:relative;width:100%;max-width:860px;margin:0 auto;aspect-ratio:1000/1080;
  background:linear-gradient(160deg,#eef7fd,#dfeef8 60%,#d6e7f2);
  border:1px solid #cfe0ec;border-radius:20px;box-shadow:inset 0 1px 0 #fff,var(--shadow);
  overflow:hidden;touch-action:none}
.board{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.viewport{position:absolute;inset:0;transform-origin:0 0;will-change:transform;touch-action:none}
.zoom-ctrl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:60}
.zbtn{width:42px;height:42px;border-radius:11px;border:2px solid var(--line);background:rgba(255,255,255,.92);
  color:var(--ink);font-size:20px;font-weight:900;line-height:1;cursor:pointer;
  box-shadow:0 2px 6px rgba(27,58,87,.18);display:flex;align-items:center;justify-content:center}
.zbtn:hover{border-color:#9fb2c2}
.zbtn:active{transform:translateY(1px)}
.silhouette{fill:#d4dfe8;stroke:#a7b7c4;stroke-width:1.3;stroke-linejoin:round;
  transition:fill .25s ease}
.silhouette.near{fill:#ffe3ad;stroke:var(--gold)}
/* nine official regions: dashed boundary lines */
.region-line{fill:none;stroke:#90a2b1;stroke-width:1.2;stroke-dasharray:6 4;
  stroke-linejoin:round;transition:fill .25s ease}
.region-line.near{fill:#ffe3ad;stroke:var(--gold);stroke-dasharray:none}
.region-line.filled{stroke:#fff;stroke-dasharray:none;stroke-width:1}
/* cities: dot at real spot + arc leader + label slot */
.city-dot{fill:#94a6b4;transition:fill .25s}
.city-dot.near-dot{fill:var(--gold)}
.city-arc{fill:none;stroke:#94a6b4;stroke-width:2.2;stroke-linecap:round;transition:stroke .25s}
.city-ring{fill:#eef4f8;stroke:#8aa0b2;stroke-width:2.2;stroke-dasharray:4 4;
  transition:fill .15s,stroke .15s}
.city-ring.near{fill:#ffe3ad;stroke:var(--gold);stroke-dasharray:none}
.city-ring.filled{stroke-dasharray:none}
.region-name{font-family:"Noto Sans TC";font-weight:700;fill:#8195a6;text-anchor:middle;
  pointer-events:none;paint-order:stroke;stroke:#e7f0f7;stroke-width:4px;stroke-linejoin:round}
.glabel{font-family:"Noto Sans TC";font-weight:800;fill:#46637a;text-anchor:middle;
  opacity:0;transition:opacity .2s;pointer-events:none;paint-order:stroke;
  stroke:#eef5fa;stroke-width:4px}
body.show-hint .glabel{opacity:1}
.tray-label{max-width:860px;margin:14px auto 6px;padding:0 4px;font-size:13px;font-weight:700;color:var(--ink2)}
.pill{position:absolute;cursor:grab;touch-action:none;user-select:none;z-index:12;
  display:flex;align-items:center;gap:4px;font-weight:700;color:#fff;
  padding:4px 9px;border-radius:999px;white-space:nowrap;min-height:30px;
  box-shadow:0 3px 7px rgba(27,58,87,.3);font-size:clamp(11px,2vw,13px);
  text-shadow:0 1px 2px rgba(0,0,0,.32);transform:scale(var(--cs,1));transform-origin:center center}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.95);
  box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.pill.animating{transition:left .26s ease,top .26s ease}
.pill.dragging{cursor:grabbing;z-index:50;opacity:.72;box-shadow:0 10px 17px rgba(27,58,87,.42)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;min-height:44px}
.seg-btn{appearance:none;border:0;background:transparent;font-family:inherit;font-weight:700;font-size:14px;
  color:var(--ink2);padding:0 14px;cursor:pointer}
.seg-btn.active{background:var(--ink);color:#fff}
.tray{max-width:860px;margin:0 auto;display:flex;flex-wrap:wrap;gap:9px;justify-content:center;
  align-items:center;background:rgba(255,255,255,.62);border:1px solid #d3e0ea;border-radius:16px;
  padding:14px 12px;min-height:64px}
.tray:empty::before{content:"全部就位 🎉";color:#9fb2c2;font-weight:700;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:#fff;
  padding:8px 15px;border-radius:999px;white-space:nowrap;min-height:40px;cursor:grab;
  touch-action:none;user-select:none;font-size:clamp(13px,2.4vw,16px);
  box-shadow:0 3px 7px rgba(27,58,87,.3);text-shadow:0 1px 2px rgba(0,0,0,.32)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.95);
  box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.chip:active{cursor:grabbing}
.chip.shake{animation:shake .36s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.flychip{position:fixed;z-index:9999;pointer-events:none;opacity:.9;
  transform:translate(-50%,-50%);box-shadow:0 10px 18px rgba(27,58,87,.42)}
.placed-label{font-family:"Noto Sans TC";font-weight:900;fill:#46637a;text-anchor:middle;
  paint-order:stroke;stroke:#eef5fa;stroke-width:4px;stroke-linejoin:round}
.drop-mark{fill:none;stroke:var(--coral);stroke-width:2.6;opacity:0;transition:opacity .1s}
.drop-mark.on{opacity:.95}
.drop-dot{fill:var(--coral);opacity:0}
.drop-dot.on{opacity:.95}
.done-banner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;text-align:center;background:rgba(255,255,255,.8);
  backdrop-filter:blur(2px);z-index:80;border-radius:20px}
.done-banner.show{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.done-banner .big{font-size:clamp(28px,7vw,52px);font-weight:900;color:var(--coral-d);letter-spacing:.05em}
.done-banner .sub{font-size:clamp(14px,3vw,18px);color:var(--ink2);font-weight:700}
.confetti{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(640px) rotate(540deg);opacity:0}}
footer{text-align:center;color:#8499a9;font-size:12px;margin-top:18px}
@media (max-width:520px){
  body{padding:12px 8px 50px}
  .controls .btn{flex:1 1 calc(50% - 8px);justify-content:center}
  .tab{flex:1 1 calc(50% - 8px);text-align:center}
}
@media (min-width:760px){
  .wrap{max-width:1000px}
  .play{display:flex;gap:22px;align-items:flex-start;justify-content:center}
  .stage{width:min(660px,62vw);max-width:none;height:auto;margin:0;flex:0 0 auto}
  .side{flex:0 1 280px;min-width:180px;position:sticky;top:12px;align-self:flex-start}
  .tray-label{margin:0 0 8px;max-width:none}
  .tray{margin:0;max-width:none;flex-direction:column;align-items:flex-start;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important}.tab,.btn,.chip{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title">日本地圖<span class="jp">JAPAN</span>拖曳拼圖</div>
    <div class="subtitle">把名稱拖到地圖正確位置，放對就上色。</div>
  </header>
  <div class="tabs" id="tabs">
    <button class="tab active" data-mode="islands">日本四大島</button>
    <button class="tab" data-mode="regions">官方地區（九區）</button>
    <button class="tab" data-mode="cities">主要城市</button>
  </div>
  <div class="controls">
    <button class="btn primary" id="btnShuffle">重新開始</button>
    <button class="btn ghosthint" id="btnHint">顯示提示名稱</button>
  </div>
  <div class="play">
    <div class="stage" id="stage">
      <div class="viewport" id="viewport">
        <svg class="board" id="board" viewBox="0 0 1000 1080" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="zoom-ctrl" id="zoomCtrl">
        <button class="zbtn" id="zOut" aria-label="縮小">－</button>
        <button class="zbtn" id="zReset" aria-label="重設縮放">⟲</button>
        <button class="zbtn" id="zIn" aria-label="放大">＋</button>
      </div>
      <div class="done-banner" id="doneBanner">
        <div class="big">完成！🎉</div>
        <div class="sub" id="doneSub"></div>
        <button class="btn primary" id="btnAgain" style="pointer-events:auto">再玩一次</button>
      </div>
    </div>
    <div class="side">
      <div class="tray-label" id="trayLabel">名稱（拖到地圖上對應的位置）</div>
      <div class="tray" id="tray"></div>
    </div>
  </div>
  <footer>四大島 → 九大地區 → 主要城市，循序認識日本。真實地圖輪廓，可離線使用。</footer>
  <div class="credit">林家花園2026日本中部地區行前教育 製作</div>
</div>

<script>
const DATA=JSON.parse(document.getElementById('mapdata').textContent);
const REGIONS=DATA.REGIONS, ISLANDS=DATA.ISLANDS, CITIES=DATA.CITIES;
CITIES.kansai={name:"大阪・京都",color:"#5aa83a"};
const SVGNS="http://www.w3.org/2000/svg";
const board=document.getElementById('board'), stage=document.getElementById('stage');
const viewport=document.getElementById('viewport');
const tray=document.getElementById('tray');
const $=id=>document.getElementById(id);
let baseScale=1, mode="islands", pieces=[], total=0, done=0;
let placeStyle="tray";
let z=1, panX=0, panY=0; const MAXZ=4.5;

function pathD(polys){let s='';for(const r of polys){s+='M'+r.map(p=>p[0]+','+p[1]).join('L')+'Z';}return s;}
function getScale(){baseScale=stage.clientWidth/1000;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function clampPan(){const W=stage.clientWidth,H=stage.clientHeight;
  panX=clamp(panX,W-W*z,0); panY=clamp(panY,H-H*z,0);}
function applyTransform(){
  viewport.style.transform=`translate(${panX}px,${panY}px) scale(${z})`;
  const cs=(1/z).toFixed(4);
  for(const o of pieces){ if(o.el.classList.contains('pill')) o.el.style.setProperty('--cs',cs); }
}
function resetZoom(){z=1;panX=0;panY=0;applyTransform();}
function zoomAround(ax,ay,factor){
  const nz=clamp(z*factor,1,MAXZ);
  panX=ax-nz*((ax-panX)/z); panY=ay-nz*((ay-panY)/z);
  z=nz; clampPan(); applyTransform();
}
function stageToSvg(cx,cy){
  const r=stage.getBoundingClientRect();
  return [((cx-r.left-panX)/z)/baseScale, ((cy-r.top-panY)/z)/baseScale];
}

const ISLAND_ORDER=["hokkaido","honshu","shikoku","kyushu"];
const REGION_ORDER=["hokkaido","tohoku","kanto","hokuriku","chubu","kinki","chugoku","shikoku","kyushu"];
const CITY_ORDER=["sapporo","sendai","kanazawa","tokyo","nagoya","kansai","hiroshima","matsuyama","fukuoka"];

/* cities: real dot position on the map + label slot out in the sea (arc leader between them) */
const CITY_DOT={
  sapporo:[624,182], sendai:[601,484], kanazawa:[400,586], tokyo:[545,638],
  nagoya:[412,668], kansai:[352,687], hiroshima:[200,714], matsuyama:[215,745], fukuoka:[102,760]
};
const CITY_SLOT={
  sapporo:[430,150], sendai:[845,455], kanazawa:[330,355], tokyo:[850,660],
  nagoya:[600,900], kansai:[400,1010], hiroshima:[165,470], matsuyama:[220,1010], fukuoka:[95,600]
};

const MODES={
  islands:{instruct:"<b>日本四大島：</b>北海道、本州、四國、九州。把島名拖到對應的島嶼上。",
    order:ISLAND_ORDER, src:ISLANDS},
  regions:{instruct:"<b>日本官方地區（九大區）：</b>北海道、東北、關東、中部、北陸、近畿、四國、中國、九州。虛線為各區界線。",
    order:REGION_ORDER, src:REGIONS},
  cities:{instruct:"<b>主要城市：</b>札幌、福岡、廣島、東京、名古屋、大阪・京都。把城市名拖到引線末端的圈圈。",
    order:CITY_ORDER}
};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- board ---------- */
let boardEl={}; // id -> element(s)
function mk(tag){return document.createElementNS(SVGNS,tag);}
function arcPath(S,D){
  const mx=(S[0]+D[0])/2,my=(S[1]+D[1])/2;
  const dx=D[0]-S[0],dy=D[1]-S[1],len=Math.hypot(dx,dy)||1,k=0.16*len;
  const c1=[mx-dy/len*k,my+dx/len*k],c2=[mx+dy/len*k,my-dx/len*k];
  const CX=470,CY=560;
  const C=dist(c1[0],c1[1],CX,CY)>dist(c2[0],c2[1],CX,CY)?c1:c2;
  return `M${S[0]} ${S[1]} Q${C[0].toFixed(1)} ${C[1].toFixed(1)} ${D[0]} ${D[1]}`;
}
function buildBoard(){
  resetZoom();
  board.innerHTML=''; boardEl={};
  document.body.classList.remove('show-hint');
  const bh=$('btnHint'); if(bh) bh.classList.remove('on');

  // base: four-island silhouette (solid coast)
  const sil={};
  ISLAND_ORDER.forEach(iid=>{
    const p=mk('path');p.setAttribute('d',pathD(ISLANDS[iid].polys));p.setAttribute('class','silhouette');
    board.appendChild(p);sil[iid]=p;
  });
  // nine official regions as dashed boundary lines (always shown)
  const reg={};
  REGION_ORDER.forEach(rid=>{
    const p=mk('path');p.setAttribute('d',pathD(REGIONS[rid].polys));p.setAttribute('class','region-line');
    board.appendChild(p);reg[rid]=p;
  });

  if(mode==='islands'){
    ISLAND_ORDER.forEach(id=>{ boardEl[id]=sil[id]; });
    ISLAND_ORDER.forEach(id=>{const o=ISLANDS[id];
      const t=mk('text');t.setAttribute('x',o.c[0]);t.setAttribute('y',o.c[1]+6);
      t.setAttribute('class','glabel');t.setAttribute('font-size',id==='honshu'?46:32);t.textContent=o.name;board.appendChild(t);});
  }else if(mode==='regions'){
    REGION_ORDER.forEach(id=>{ boardEl[id]=reg[id]; });
    REGION_ORDER.forEach(id=>{const o=REGIONS[id];
      const t=mk('text');t.setAttribute('x',o.c[0]);t.setAttribute('y',o.c[1]+6);
      t.setAttribute('class','glabel');t.setAttribute('font-size',30);t.textContent=o.name;board.appendChild(t);});
  }else{ // cities: official region names on base + dot + arc leader + label slot
    REGION_ORDER.forEach(rid=>{
      const o=REGIONS[rid];
      const t=mk('text');t.setAttribute('x',o.c[0]);t.setAttribute('y',o.c[1]+6);
      t.setAttribute('class','region-name');t.setAttribute('font-size',26);
      t.textContent=o.name.replace(/（.*?）/,'');board.appendChild(t);
    });
    CITY_ORDER.forEach(id=>{
      const D=CITY_DOT[id], S=CITY_SLOT[id];
      const arc=mk('path');arc.setAttribute('d',arcPath(S,D));arc.setAttribute('class','city-arc');board.appendChild(arc);
      const dot=mk('circle');dot.setAttribute('cx',D[0]);dot.setAttribute('cy',D[1]);dot.setAttribute('r',7);dot.setAttribute('class','city-dot');board.appendChild(dot);
      const ring=mk('circle');ring.setAttribute('cx',S[0]);ring.setAttribute('cy',S[1]);ring.setAttribute('r',14);ring.setAttribute('class','city-ring');board.appendChild(ring);
      boardEl[id]={ring,dot,arc};
      const lab=mk('text');lab.setAttribute('x',S[0]);lab.setAttribute('y',S[1]-20);
      lab.setAttribute('class','glabel');lab.setAttribute('font-size',28);lab.textContent=CITIES[id].name;board.appendChild(lab);
    });
  }
  // drop-point marker (constant screen size, shown while dragging)
  dropRing=mk('circle');
  dropRing.setAttribute('class','drop-mark');dropRing.setAttribute('vector-effect','non-scaling-stroke');
  dropDot=mk('circle');dropDot.setAttribute('class','drop-dot');
  board.appendChild(dropRing);board.appendChild(dropDot);
}
let dropRing=null, dropDot=null;
function showDrop(sx,sy){
  if(!dropRing)return;
  const rr=9/z;
  dropRing.setAttribute('cx',sx);dropRing.setAttribute('cy',sy);dropRing.setAttribute('r',rr);
  dropDot.setAttribute('cx',sx);dropDot.setAttribute('cy',sy);dropDot.setAttribute('r',2.4/z);
  dropRing.classList.add('on');dropDot.classList.add('on');
}
function hideDrop(){ if(dropRing){dropRing.classList.remove('on');dropDot.classList.remove('on');} }
function clearPieces(){pieces.forEach(o=>o.el.remove());pieces=[]; board.querySelectorAll('.placed-label').forEach(n=>n.remove());}
function buildPieces(){
  clearPieces(); done=0;
  const cfg=MODES[mode];
  const ids=shuffle(cfg.order); total=ids.length;
  ids.forEach((id)=>{
    const isCity=(mode==='cities');
    const meta=isCity?CITIES[id]:cfg.src[id];
    const el=document.createElement('div');
    el.style.background=meta.color; el.textContent=meta.name;
    const o={id,el,kind:isCity?'city':'poly',sx:0,sy:0,locked:false};
    if(isCity){o.ring=CITY_SLOT[id];o.dot=CITY_DOT[id];o.thr=60;}
    else{o.hitPolys=cfg.src[id].polys;o.centroid=cfg.src[id].c;o.color=meta.color;}
    el._o=o; pieces.push(o);
    el.className='chip';
    tray.appendChild(el);
    el.addEventListener('pointerdown',ev=>startTrayDrag(o,ev));
  });
  layoutAll(); updateCounter();
}
function layoutPill(o){
  const w=o.el.offsetWidth||60, h=o.el.offsetHeight||40;
  o.el.style.left=(o.sx*baseScale - w/2)+'px';
  o.el.style.top=(o.sy*baseScale - h/2)+'px';
}
function returnHome(o){
  o.el.classList.add('animating'); o.sx=o.hx; o.sy=o.hy; layoutPill(o);
  setTimeout(()=>o.el.classList.remove('animating'),300);
}
function layoutAll(){getScale();clampPan();applyTransform();
  for(const o of pieces){ if(o.el.classList.contains('pill')) layoutPill(o); }
}

/* ---------- geometry hit-test ---------- */
function pointInRing(x,y,ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function pointInPolys(x,y,polys){let c=0;for(const r of polys){if(pointInRing(x,y,r))c++;}return c%2===1;}
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by);}

function isHit(o){
  if(o.kind==='city') return dist(o.sx,o.sy,o.ring[0],o.ring[1])<o.thr || dist(o.sx,o.sy,o.dot[0],o.dot[1])<o.thr;
  return pointInPolys(o.sx,o.sy,o.hitPolys) || dist(o.sx,o.sy,o.centroid[0],o.centroid[1])<30;
}

/* ---------- unified input: drag pills + pinch-zoom + pan ---------- */
const ptrs=new Map();
let gesture=null, drag=null, panStart=null, pinchStart=null;
function pmid(){const a=[...ptrs.values()];return [(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2];}
function pdist(){const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}

stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.zoom-ctrl')||e.target.closest('.done-banner')) return;
  e.preventDefault();
  try{stage.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2){
    if(drag){drag.el.classList.remove('dragging');clearNear();hideDrop();drag=null;}
    const r=stage.getBoundingClientRect(), m=pmid();
    pinchStart={dist:pdist(), z, mlx:(m[0]-r.left-panX)/z, mly:(m[1]-r.top-panY)/z};
    gesture='pinch'; return;
  }
  const t=(placeStyle==='scatter')?e.target.closest('.pill'):null;
  if(t && t._o && !t._o.locked){
    drag=t._o; gesture='drag';
    drag.el.classList.remove('animating'); drag.el.classList.add('dragging');
    const [sx,sy]=stageToSvg(e.clientX,e.clientY);
    drag.offx=sx-drag.sx; drag.offy=sy-drag.sy; showDrop(drag.sx,drag.sy);
  }else{
    gesture='pan'; panStart={x:e.clientX,y:e.clientY,px:panX,py:panY};
  }
});
stage.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.get(e.pointerId).x=e.clientX; ptrs.get(e.pointerId).y=e.clientY;
  if(gesture==='pinch'&&ptrs.size>=2){
    const r=stage.getBoundingClientRect(), m=pmid();
    const nz=clamp(pinchStart.z*(pdist()/pinchStart.dist),1,MAXZ);
    panX=(m[0]-r.left)-nz*pinchStart.mlx; panY=(m[1]-r.top)-nz*pinchStart.mly;
    z=nz; clampPan(); applyTransform();
  }else if(gesture==='drag'&&drag){
    const [sx,sy]=stageToSvg(e.clientX,e.clientY);
    drag.sx=clamp(sx-drag.offx,14,986); drag.sy=clamp(sy-drag.offy,14,1066);
    layoutPill(drag); near(drag); showDrop(drag.sx,drag.sy);
  }else if(gesture==='pan'&&panStart){
    panX=panStart.px+(e.clientX-panStart.x); panY=panStart.py+(e.clientY-panStart.y);
    clampPan(); applyTransform();
  }
});
function endPointer(e){
  ptrs.delete(e.pointerId);
  try{stage.releasePointerCapture(e.pointerId);}catch(_){}
  if(gesture==='pinch'){
    if(ptrs.size===1){const p=[...ptrs.values()][0];gesture='pan';panStart={x:p.x,y:p.y,px:panX,py:panY};}
    else if(ptrs.size===0){gesture=null;}
  }else if(gesture==='drag'&&drag){
    drag.el.classList.remove('dragging');clearNear();hideDrop();
    if(isHit(drag)) placeCorrect(drag); else returnHome(drag);
    drag=null;gesture=null;
  }else if(gesture==='pan'){ if(ptrs.size===0)gesture=null; }
}
stage.addEventListener('pointerup',endPointer);
stage.addEventListener('pointercancel',endPointer);

stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  zoomAround(e.clientX-r.left,e.clientY-r.top, e.deltaY<0?1.13:1/1.13);
},{passive:false});
$('zIn').addEventListener('click',()=>zoomAround(stage.clientWidth/2,stage.clientHeight/2,1.35));
$('zOut').addEventListener('click',()=>zoomAround(stage.clientWidth/2,stage.clientHeight/2,1/1.35));
$('zReset').addEventListener('click',resetZoom);

function near(o){
  clearNear();
  const be=boardEl[o.id]; if(!be) return;
  if(o.kind==='city'){
    if(dist(o.sx,o.sy,o.ring[0],o.ring[1])<o.thr+10 || dist(o.sx,o.sy,o.dot[0],o.dot[1])<o.thr+10){
      be.ring.classList.add('near'); be.dot.classList.add('near-dot');
    }
  }else{
    if(pointInPolys(o.sx,o.sy,o.hitPolys)||dist(o.sx,o.sy,o.centroid[0],o.centroid[1])<40) be.classList.add('near');
  }
}
function clearNear(){board.querySelectorAll('.near,.near-dot').forEach(n=>n.classList.remove('near','near-dot'));}

/* ---------- tray chip drag onto map ---------- */
function inStage(cx,cy){const r=stage.getBoundingClientRect();return cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom;}
function startTrayDrag(o,e){
  if(o.locked)return; e.preventDefault();
  o.el.setPointerCapture(e.pointerId);
  const fly=o.el.cloneNode(true); fly.classList.add('flychip'); document.body.appendChild(fly);
  o.el.style.opacity='.3';
  const moveTo=(cx,cy)=>{fly.style.left=cx+'px';fly.style.top=cy+'px';};
  moveTo(e.clientX,e.clientY);
  const move=ev=>{
    moveTo(ev.clientX,ev.clientY);
    if(inStage(ev.clientX,ev.clientY)){
      const [sx,sy]=stageToSvg(ev.clientX,ev.clientY);o.sx=sx;o.sy=sy;near(o);showDrop(sx,sy);
    }else{clearNear();hideDrop();}
  };
  const up=ev=>{
    o.el.removeEventListener('pointermove',move);
    o.el.removeEventListener('pointerup',up);
    o.el.removeEventListener('pointercancel',up);
    try{o.el.releasePointerCapture(e.pointerId);}catch(_){}
    fly.remove(); clearNear(); hideDrop();
    let ok=false;
    if(inStage(ev.clientX,ev.clientY)){const [sx,sy]=stageToSvg(ev.clientX,ev.clientY);o.sx=sx;o.sy=sy;ok=isHit(o);}
    if(ok) placeCorrect(o);
    else { o.el.style.opacity=''; o.el.classList.add('shake'); setTimeout(()=>o.el.classList.remove('shake'),360); }
  };
  o.el.addEventListener('pointermove',move);
  o.el.addEventListener('pointerup',up);
  o.el.addEventListener('pointercancel',up);
}
function addLabel(x,y,txt,size,fill){
  const t=document.createElementNS(SVGNS,'text');
  t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('class','placed-label');
  if(fill) t.style.fill=fill;
  t.setAttribute('font-size',size);t.textContent=txt;board.appendChild(t);
}
function placeCorrect(o){
  o.locked=true;
  const be=boardEl[o.id];
  if(o.kind==='city'){
    const col=CITIES[o.id].color, S=o.ring;
    if(be){ be.dot.style.fill=col; be.arc.style.stroke=col;
      be.ring.style.fill=col; be.ring.style.stroke=col;
      be.ring.classList.add('filled'); be.ring.classList.remove('near'); }
    addLabel(S[0],S[1]-20,CITIES[o.id].name,28,col);
  }else{
    if(be){ be.style.fill=o.color; be.classList.add('filled'); be.classList.remove('near'); }
  }
  o.el.remove();
  done++; updateCounter();
  if(done===total){
    if(mode!=='cities'){ document.body.classList.add('show-hint'); const bh=$('btnHint'); if(bh) bh.classList.add('on'); }
    celebrate();
  }
}

function updateCounter(){const d=$('cDone'); if(d){d.textContent=done; $('cTotal').textContent=total;}}

/* ---------- solve / celebrate ---------- */
function solveAll(){
  pieces.filter(o=>!o.locked).forEach((o,i)=>setTimeout(()=>{ if(!o.locked) placeCorrect(o); }, i*170));
}
function celebrate(){
  const cols=['#e8694a','#caa14a','#5fb6cb','#88bd38','#d4478a','#9163bf','#3f86c0'];
  for(let i=0;i<34;i++){const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'%';c.style.background=cols[i%cols.length];
    c.style.animationDuration=(1.6+Math.random()*1.4)+'s';c.style.animationDelay=(Math.random()*.4)+'s';
    stage.appendChild(c);setTimeout(()=>c.remove(),3400);}
}

/* ---------- modes ---------- */
function setMode(m){
  mode=m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===m));
  $('doneBanner').classList.remove('show');
  buildBoard(); buildPieces();
}
$('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)setMode(t.dataset.mode);});
$('btnShuffle').addEventListener('click',()=>{$('doneBanner').classList.remove('show');buildBoard();buildPieces();});
$('btnAgain').addEventListener('click',()=>{$('doneBanner').classList.remove('show');buildBoard();buildPieces();});
$('btnHint').addEventListener('click',function(){
  document.body.classList.toggle('show-hint');
  this.classList.toggle('on',document.body.classList.contains('show-hint'));
});
window.addEventListener('resize',layoutAll);
setMode('islands');
</script>
</body>
