<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>日本中部地區地圖拼圖</title>
<style>
:root{
  --sea:#d8ecf5; --land-line:#ffffff;
  --hokuriku:#e0876b; --tokai:#6fa3c4; --koshinetsu:#84b87f;
  --neigh:#ece9e2; --neigh-line:#d8d2c4;
  --ink:#2b2b2b; --paper:#fbf7ee; --accent:#c0392b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  background:linear-gradient(160deg,#eef5f9,#f7f2e8);
  color:var(--ink); padding:14px; min-height:100vh;
}
.wrap{max-width:1340px;margin:0 auto;}
header{text-align:center;margin-bottom:10px;}
header h1{font-size:26px;margin:0 0 4px;letter-spacing:1px;}
header p{margin:0;font-size:14px;color:#6b6b6b;}
.toolbar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
  margin:10px 0;
}
.btn{
  border:none;border-radius:999px;padding:9px 16px;font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit;min-height:42px;transition:.15s;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.btn-terrain{background:#5a7d52;color:#fff;}
.btn-terrain.on{background:#8d5a3a;}
.btn-answer{background:#e0a526;color:#5a3d00;}
.btn-reset{background:#fff;color:#444;border:1px solid #ddd;}
.btn:active{transform:translateY(1px);}
.progress{
  background:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;
  border:1px solid #e6e0d4;min-height:42px;display:flex;align-items:center;gap:6px;
}
.progress b{color:var(--accent);}
.layout{display:flex;gap:14px;align-items:flex-start;}
.mapcol{flex:1 1 auto;min-width:0;}
.viewport{
  position:relative;width:100%;aspect-ratio:1000/820;
  background:var(--sea);border-radius:16px;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.08);
  touch-action:none;
}
.world{position:absolute;inset:0;transform-origin:0 0;}
.world svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
canvas.terrain{position:absolute;top:0;left:0;pointer-events:none;opacity:0;transition:opacity .4s;}
canvas.terrain.show{opacity:1;}
.maplegend{
  position:absolute;top:12px;left:12px;z-index:6;pointer-events:none;
  background:rgba(255,255,255,.92);border:1px solid #e2dccf;border-radius:12px;
  padding:9px 12px;box-shadow:0 2px 8px rgba(0,0,0,.12);
  font-size:14px;font-weight:700;line-height:1.5;
}
.maplegend .row{display:flex;align-items:center;gap:7px;}
.maplegend .sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.18);}
.pref-fill{stroke:var(--land-line);stroke-width:2;transition:filter .2s;}
.pref-hok{fill:var(--hokuriku);}
.pref-tok{fill:var(--tokai);}
.pref-kos{fill:var(--koshinetsu);}
.terrain-on .pref-fill{fill:transparent;stroke:#534a3e;stroke-width:1.4;opacity:.92;}
.terrain-on .neigh{opacity:.35;}
.neigh{fill:var(--neigh);stroke:var(--neigh-line);stroke-width:1;}
.pref-label{font-size:19px;font-weight:700;fill:#27323a;text-anchor:middle;
  paint-order:stroke;stroke:#fff;stroke-width:3.4px;stroke-linejoin:round;pointer-events:none;}
.terrain-on .pref-label{fill:#1d1d1d;stroke:#fff;stroke-width:3.8px;}
.hok-outline{fill:none;stroke:#9c3b1c;stroke-width:3.4;stroke-dasharray:9 6;
  stroke-linejoin:round;opacity:.9;}
.hok-badge{font-size:16px;font-weight:800;fill:#fff;text-anchor:middle;}
.hok-badge-bg{fill:#9c3b1c;}
.slot{fill:rgba(255,255,255,.72);stroke:#d23b22;stroke-width:3.6;stroke-dasharray:8 5;opacity:1;
  transform-box:fill-box;transform-origin:center;animation:slotpulse 1.5s ease-in-out infinite;}
@keyframes slotpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.16);}}
.slot-q{font-size:28px;font-weight:900;fill:#d23b22;text-anchor:middle;opacity:1;
  paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;}
.slot.filled{display:none;}
.slot.filled + .slot-q,.slot-g .slot.filled{display:none;}
.marker-pin{fill:var(--accent);stroke:#fff;stroke-width:2;}
.marker-sea{fill:#1f6f9c;stroke:#fff;stroke-width:2;}
.marker-label{font-size:16px;font-weight:800;fill:#fff;text-anchor:middle;
  paint-order:stroke;stroke:#000;stroke-width:0.6px;}
.marker-label-bg{rx:6;}
.peak{opacity:0;transition:opacity .35s;}
.terrain-on .peak{opacity:1;}
.peak-tri{font-size:15px;fill:#3a2a16;text-anchor:middle;}
.peak-name{font-size:12px;font-weight:700;fill:#2a1d0e;text-anchor:middle;
  paint-order:stroke;stroke:#fff;stroke-width:2.6px;stroke-linejoin:round;}

.tray{
  flex:0 0 190px;background:var(--paper);border:1px solid #e8e0cf;border-radius:16px;
  padding:12px;box-shadow:0 4px 12px rgba(0,0,0,.06);align-self:stretch;
}
.tray h3{margin:2px 0 10px;font-size:15px;text-align:center;color:#555;}
.chips{display:flex;flex-direction:column;gap:9px;}
.chip{
  display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #e3dccd;
  border-radius:12px;padding:9px 11px;font-size:16px;font-weight:700;cursor:grab;
  min-height:46px;touch-action:none;user-select:none;box-shadow:0 2px 5px rgba(0,0,0,.07);
  transition:transform .12s,box-shadow .12s;
}
.chip .ic{font-size:20px;}
.chip.placed{background:#eef3ec;border-color:#cfe0c8;color:#7aa06f;cursor:default;opacity:.7;}
.chip.placed .ic{filter:grayscale(.4);}
.chip.dragging{opacity:.35;}
.chip.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ghost{
  position:fixed;z-index:9999;pointer-events:none;background:#fff;border:2px solid var(--accent);
  border-radius:12px;padding:8px 12px;font-size:16px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.25);
  display:flex;align-items:center;gap:7px;transform:translate(-50%,-50%);
}
.legend{
  display:flex;flex-wrap:wrap;gap:14px 20px;justify-content:center;margin:14px auto 4px;
  background:#fff;border-radius:14px;padding:11px 16px;max-width:760px;
  border:1px solid #ece6da;font-size:13.5px;
}
.legend .grp{display:flex;align-items:center;gap:6px;}
.sw{width:16px;height:16px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.15);}
.legend .hint{color:#8a8a8a;}
.ramp{display:flex;align-items:center;gap:6px;}
.ramp .bar{width:120px;height:12px;border-radius:6px;
  background:linear-gradient(90deg,#b0cd96,#d0c484,#bca26c,#967856,#a8968a,#f0f0ee);}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:#2b2b2b;color:#fff;padding:11px 18px;border-radius:12px;font-size:15px;
  opacity:0;transition:.3s;z-index:9998;max-width:90vw;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.3);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.win{
  position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;
  justify-content:center;z-index:9997;padding:20px;
}
.win.show{display:flex;}
.win .card{background:#fff;border-radius:20px;padding:28px 26px;text-align:center;max-width:340px;
  box-shadow:0 16px 50px rgba(0,0,0,.3);}
.win .card h2{margin:0 0 8px;font-size:24px;}
.win .card p{margin:0 0 18px;color:#555;font-size:15px;line-height:1.6;}
footer{text-align:center;margin-top:18px;font-size:12px;color:#aaa;}

@media(max-width:768px){
  .layout{flex-direction:column;}
  .mapcol{width:100%;flex:0 0 auto;}
  .viewport{aspect-ratio:1/1.18;}
  .tray{flex:1 1 auto;width:100%;align-self:auto;margin-top:4px;}
  .chips{flex-direction:row;flex-wrap:wrap;justify-content:center;}
  .chip{flex:0 0 auto;}
  header h1{font-size:22px;}
}
@media(max-width:520px){
  body{padding:8px;}
  header h1{font-size:19px;}
  header p{font-size:12.5px;}
  .pref-label{font-size:21px;}
  .chip{font-size:15px;padding:8px 10px;}
  .legend{gap:8px 14px;font-size:12.5px;}
}
@media(max-width:360px){
  .chip{font-size:14px;min-height:44px;}
  .ramp .bar{width:90px;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>日本中部地區地圖拼圖</h1>
    <p>把右邊的旅行景點拖到地圖上正確的位置 ‧ 可用雙指放大地圖</p>
  </header>

  <div class="toolbar">
    <button class="btn btn-terrain" id="terrainBtn">⛰️ 開啟地形圖</button>
    <button class="btn btn-answer" id="answerBtn">💡 顯示答案</button>
    <button class="btn btn-reset" id="resetBtn">↺ 重新挑戰</button>
  </div>

  <div class="layout">
    <div class="mapcol">
      <div class="viewport" id="viewport">
        <div class="maplegend">
          <div class="row"><span class="sw" style="background:var(--hokuriku)"></span>北陸</div>
          <div class="row"><span class="sw" style="background:var(--tokai)"></span>東海</div>
          <div class="row"><span class="sw" style="background:var(--koshinetsu)"></span>甲信越</div>
        </div>
        <div class="world" id="world">
          <canvas class="terrain" id="terrain"></canvas>
          <svg id="svg" viewBox="0 0 1000 820" xmlns="http://www.w3.org/2000/svg">
            <g id="gNeigh"></g>
            <g id="gPref"></g>
            <g id="gHok"></g>
            <g id="gLabels"></g>
            <g id="gPeaks"></g>
            <g id="gSlots"></g>
            <g id="gMarkers"></g>
          </svg>
        </div>
      </div>
    </div>

    <div class="tray">
      <h3>🧳 旅行景點（拖到地圖上）</h3>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <footer>林家花園 2026 日本中部地區行前教育 ‧ 製作</footer>
</div>

<div class="toast" id="toast"></div>

/* peaks (terrain mode) */
const PKLABEL={
 "富士山":{dx:0,dy:-10,a:"middle"},
 "北岳":{dx:0,dy:-10,a:"middle"},

/* ---- destinations ---- */
const DEST=[

/* chips */
const chips=document.getElementById("chips");
const chipEls={};
DEST.forEach(d=>{
  const c=document.createElement("div");c.className="chip";c.dataset.key=d.key;
  c.innerHTML='<span class="ic">'+d.ic+'</span><span>'+d.key+'</span>';
  chips.appendChild(c);chipEls[d.key]=c;
  attachChipDrag(c,d);
});

/* ---- chip drag ---- */
const svg=document.getElementById("svg");
let ghost=null;
function attachChipDrag(c,d){
  c.addEventListener("pointerdown",e=>{
    if(d.placed)return;
    e.preventDefault();e.stopPropagation();
    c.setPointerCapture(e.pointerId);
    c.classList.add("dragging");
    ghost=document.createElement("div");ghost.className="ghost";
    ghost.innerHTML='<span>'+d.ic+'</span><span>'+d.key+'</span>';
    document.body.appendChild(ghost);
    moveGhost(e.clientX,e.clientY);
    const mv=ev=>moveGhost(ev.clientX,ev.clientY);
    const up=ev=>{
      c.removeEventListener("pointermove",mv);
      c.removeEventListener("pointerup",up);
      c.classList.remove("dragging");
      if(ghost){ghost.remove();ghost=null;}
      tryDrop(d,ev.clientX,ev.clientY);
    };
    c.addEventListener("pointermove",mv);
    c.addEventListener("pointerup",up);
  });
}
function moveGhost(x,y){if(ghost){ghost.style.left=x+"px";ghost.style.top=y+"px";}}
function clientToView(x,y){
  const r=svg.getBoundingClientRect();
  const scale=Math.min(r.width/1000,r.height/820);
  const ox=(r.width-1000*scale)/2, oy=(r.height-820*scale)/2;
  return {x:(x-r.left-ox)/scale,y:(y-r.top-oy)/scale};
}
function tryDrop(d,cx,cy){
  const v=clientToView(cx,cy);
  const dist=Math.hypot(v.x-d.tx,v.y-d.ty);
  if(dist<58){placeDest(d);}
  else{
    const ch=chipEls[d.key];ch.classList.add("shake");
    setTimeout(()=>ch.classList.remove("shake"),420);
    toast("再靠近一點！想想「"+d.key+"」在中部的哪個方向？");
  }
}

let placedCount=0;
function placeDest(d,silent){
  if(d.placed)return;
  d.placed=true;placedCount++;
  chipEls[d.key].classList.add("placed");
  slotEls[d.key].c.classList.add("filled");
  slotEls[d.key].g.querySelector(".slot-q").style.display="none";
  drawMarker(d);
  if(!silent){
    if(placedCount===DEST.length){
      toast("✓ "+d.key+"："+d.fact+"　🎉 全部完成！",6400);
    }else{
      toast("✓ "+d.key+"："+d.fact,5200);
    }
  }
}
function drawMarker(d){
  const g=el("g",{});
  if(d.sea){
    g.appendChild(el("circle",{cx:d.tx,cy:d.ty,r:8,class:"marker-sea"}));
  }else{
    const p=el("path",{class:"marker-pin",
      d:`M${d.tx} ${d.ty} C ${d.tx-9} ${d.ty-12}, ${d.tx-9} ${d.ty-24}, ${d.tx} ${d.ty-24} C ${d.tx+9} ${d.ty-24}, ${d.tx+9} ${d.ty-12}, ${d.tx} ${d.ty} Z`});
    g.appendChild(p);
    g.appendChild(el("circle",{cx:d.tx,cy:d.ty-16,r:4,fill:"#fff"}));
  }
  const ty=d.sea?d.ty-16:d.ty-32;
  const w=d.key.length*16+14;
  g.appendChild(el("rect",{x:d.tx-w/2,y:ty-15,width:w,height:21,rx:6,
    fill:d.sea?"#1f6f9c":"#c0392b"}));
  const t=el("text",{x:d.tx,y:ty,class:"marker-label"});t.textContent=d.key;g.appendChild(t);
  gMarkers.appendChild(g);
}

/* ---- toast ---- */
let toastT=null;
function toast(msg,dur){
  dur=dur||2600;
  const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),dur);
}

/* ---- show answer ---- */
document.getElementById("answerBtn").onclick=()=>{
  DEST.forEach(d=>{if(!d.placed)placeDest(d,true);});
  toast("💡 已顯示全部答案",4200);
};

/* ---- reset ---- */
function resetGame(){
  placedCount=0;
  gMarkers.innerHTML="";
  DEST.forEach(d=>{
    d.placed=false;
    chipEls[d.key].classList.remove("placed");
    slotEls[d.key].c.classList.remove("filled");
    slotEls[d.key].g.querySelector(".slot-q").style.display="";
  });
}
document.getElementById("resetBtn").onclick=resetGame;

/* ---- pan / zoom ---- */
const viewport=document.getElementById("viewport"),world=document.getElementById("world");
let state={s:1,tx:0,ty:0};
const pts=new Map();let pinchStart=null;
function applyT(){world.style.transform=`translate(${state.tx}px,${state.ty}px) scale(${state.s})`;}
function clamp(){
  const w=viewport.clientWidth,h=viewport.clientHeight;
  const maxx=w*(state.s-1),maxy=h*(state.s-1);
  state.tx=Math.min(0,Math.max(-maxx,state.tx));
  state.ty=Math.min(0,Math.max(-maxy,state.ty));
}
function initFit(){
  if(window.innerWidth>768){state.s=1;state.tx=0;state.ty=0;applyT();return;}
  const w=viewport.clientWidth,h=viewport.clientHeight;
  if(!w||!h)return;
  const s=1.42;           // enlarge so Chubu landmass fills the tall phone window (sides are sea, safe to crop)
  state.s=s;state.tx=(w/2)*(1-s);state.ty=(h/2)*(1-s);
  clamp();applyT();
}
viewport.addEventListener("pointerdown",e=>{
  if(e.target.closest(".chip"))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){
    const a=[...pts.values()];
    pinchStart={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),s:state.s,
      cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,tx:state.tx,ty:state.ty};
  }
});
viewport.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId))return;
  const prev=pts.get(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){
    state.tx+=e.clientX-prev.x;state.ty+=e.clientY-prev.y;clamp();applyT();
  }else if(pts.size===2&&pinchStart){
    const a=[...pts.values()];
    const nd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    let ns=Math.min(4,Math.max(1,pinchStart.s*nd/pinchStart.d));
    const r=viewport.getBoundingClientRect();
    const ox=pinchStart.cx-r.left,oy=pinchStart.cy-r.top;
    state.s=ns;
    state.tx=ox-(ox-pinchStart.tx)*(ns/pinchStart.s);
    state.ty=oy-(oy-pinchStart.ty)*(ns/pinchStart.s);
    clamp();applyT();
  }
});
function endP(e){pts.delete(e.pointerId);if(pts.size<2)pinchStart=null;}
viewport.addEventListener("pointerup",endP);
viewport.addEventListener("pointercancel",endP);
viewport.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=viewport.getBoundingClientRect();
  const ox=e.clientX-r.left,oy=e.clientY-r.top;
  const ns=Math.min(4,Math.max(1,state.s*(e.deltaY<0?1.12:0.89)));
  state.tx=ox-(ox-state.tx)*(ns/state.s);
  state.ty=oy-(oy-state.ty)*(ns/state.s);
  state.s=ns;clamp();applyT();
},{passive:false});

/* ---- terrain ---- */
const canvas=document.getElementById("terrain"),tctx=canvas.getContext("2d");
const SEEDS=GEO.seeds;const EMAX=3800,ZF=0.0011;
let terrainBuilt=false;
function elevGrid(){
  const GS=3;const gw=Math.ceil(1000/GS)+1,gh=Math.ceil(820/GS)+1;
  const E=new Float32Array(gw*gh);
  for(let j=0;j<gh;j++){const y=j*GS;
    for(let i=0;i<gw;i++){const x=i*GS;let e=0;
      for(let s=0;s<SEEDS.length;s++){
        const dx=x-SEEDS[s][0],dy=y-SEEDS[s][1],r=SEEDS[s][3];
        const v=SEEDS[s][2]*Math.exp(-(dx*dx+dy*dy)/(2*r*r));
        if(v>e)e=v;
      }
      E[j*gw+i]=e;
    }
  }
  return {E,gw,gh,GS};
}
function ramp(e){
  e=Math.max(0,Math.min(EMAX,e));
  const st=[[0,176,205,150],[450,208,198,132],[1050,188,162,108],
            [1750,150,120,86],[2500,168,150,130],[3200,240,240,238]];
  for(let k=0;k<st.length-1;k++){
    if(e>=st[k][0]&&e<st[k+1][0]){
      const t=(e-st[k][0])/(st[k+1][0]-st[k][0]);
      return [st[k][1]+(st[k+1][1]-st[k][1])*t,
              st[k][2]+(st[k+1][2]-st[k][2])*t,
              st[k][3]+(st[k+1][3]-st[k][3])*t];
    }
  }
  return [st[5][1],st[5][2],st[5][3]];
}
function buildTerrain(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const cssW=world.offsetWidth;
  if(!cssW)return;
  const contentH=cssW*820/1000;
  const k=cssW*dpr/1000;
  const cw=Math.round(1000*k),ch=Math.round(820*k);
  canvas.width=cw;canvas.height=ch;
  canvas.style.width=cssW+"px";canvas.style.height=contentH+"px";
  canvas.style.left="0px";canvas.style.top=((world.offsetHeight-contentH)/2)+"px";
  const {E,gw,gh,GS}=elevGrid();
  const sampleE=(x,y)=>{
    let gx=x/GS,gy=y/GS;
    gx=Math.max(0,Math.min(gw-1.001,gx));gy=Math.max(0,Math.min(gh-1.001,gy));
    const i=gx|0,j=gy|0,fx=gx-i,fy=gy-j;
    const a=E[j*gw+i],b=E[j*gw+i+1],c=E[(j+1)*gw+i],dd=E[(j+1)*gw+i+1];
    return a*(1-fx)*(1-fy)+b*fx*(1-fy)+c*(1-fx)*fy+dd*fx*fy;
  };
  const img=tctx.createImageData(cw,ch);const data=img.data;
  const L=[-0.55,-0.55,0.63];
  for(let py=0;py<ch;py++){
    const y=py/k;
    for(let px=0;px<cw;px++){
      const x=px/k;
      const e=sampleE(x,y);
      const ex1=sampleE(x+1.5,y),ex0=sampleE(x-1.5,y),ey1=sampleE(x,y+1.5),ey0=sampleE(x,y-1.5);
      let nx=-(ex1-ex0)/3*ZF,ny=-(ey1-ey0)/3*ZF,nz=1;
      const ln=Math.sqrt(nx*nx+ny*ny+1);nx/=ln;ny/=ln;nz/=ln;
      let sh=nx*L[0]+ny*L[1]+nz*L[2];if(sh<0)sh=0;sh=0.5+0.8*sh;
      const col=ramp(e);
      const idx=(py*cw+px)*4;
      data[idx]=Math.min(255,col[0]*sh);
      data[idx+1]=Math.min(255,col[1]*sh);
      data[idx+2]=Math.min(255,col[2]*sh);
      data[idx+3]=255;
    }
  }
  const tmp=document.createElement("canvas");tmp.width=cw;tmp.height=ch;
  tmp.getContext("2d").putImageData(img,0,0);
  tctx.clearRect(0,0,cw,ch);
  tctx.save();
  tctx.scale(k,k);
  tctx.beginPath();tctx.clip(new Path2D(GEO.land));
  tctx.scale(1/k,1/k);
  tctx.drawImage(tmp,0,0);
  tctx.restore();
  terrainBuilt=true;
}
const terrainBtn=document.getElementById("terrainBtn");
let terrainOn=false;
terrainBtn.onclick=()=>{
  terrainOn=!terrainOn;
  if(terrainOn){
    if(!terrainBuilt)buildTerrain();
    document.body.classList.add("terrain-on");
    canvas.classList.add("show");
    terrainBtn.classList.add("on");
    terrainBtn.textContent="🗺️ 關閉地形圖";
  }else{
    document.body.classList.remove("terrain-on");
    canvas.classList.remove("show");
    terrainBtn.classList.remove("on");
    terrainBtn.textContent="⛰️ 開啟地形圖";
  }
};
let rT=null;
window.addEventListener("resize",()=>{
  clearTimeout(rT);rT=setTimeout(()=>{terrainBuilt=false;if(terrainOn)buildTerrain();},250);
});
window.addEventListener("orientationchange",()=>{
  setTimeout(()=>{terrainBuilt=false;initFit();if(terrainOn)buildTerrain();},350);
});
window.addEventListener("load",initFit);
requestAnimationFrame(initFit);
</script>
